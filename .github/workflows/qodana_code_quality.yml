name: CI ServiTrack - Backend Build

# Se ejecuta cada vez que haces un push o pull request a la rama main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Copiar repositorio
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Python para FastAPI
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Instalar las dependencias del backend
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. Verificar que el servidor compila e inicia correctamente (Prueba de construcción)
      - name: Verificar compilación del sistema
        run: |
          python -c "import main; print('¡Construcción y sintaxis del backend exitosas!')"